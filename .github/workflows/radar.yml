name: Atualizar e publicar radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testar regras de elegibilidade
        run: python -m unittest discover -s tests -v
      - name: Coletar vagas
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Persistir coleta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar radar de vagas"
            git push
          fi
      - name: Preparar site público
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js config.json _site/
          cp data/jobs.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Sinalizar falha da coleta após publicar diagnóstico
        if: steps.collect.outcome == 'failure'
        run: exit 1
